name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # The release signing certificate, pinned. Android keys upgrades off this, so if a
  # build is ever signed by a different key every user has to uninstall and reinstall.
  # Hardcoded on purpose: a certificate fingerprint is public, and pinning it here turns
  # a lost or swapped keystore into a failed build instead of a broken release.
  EXPECTED_SIGNER_SHA256: 57fa69ea917871ffeb1b762b59d52284f8a3b78a06309a61783195d9f61de860

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned release"
          exit 1
        fi
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/release.jks")"

    - name: Build Release APK
      env:
        RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: release
      run: ./gradlew assembleRelease

    # Catches a wrong, missing or swapped keystore before anything is published.
    - name: Verify APK is signed with the expected key
      run: |
        APK=app/build/outputs/apk/release/app-release.apk

        # The SDK location differs by runner image, and apksigner sits under a
        # build-tools version directory, so search rather than assume a path.
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        APKSIGNER=$(find "$SDK" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
        if [ -z "$APKSIGNER" ]; then
          echo "::error::apksigner not found under $SDK"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          ls -1 "$SDK" 2>/dev/null || echo "(cannot list $SDK)"
          exit 1
        fi
        echo "using $APKSIGNER"

        "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
        ACTUAL=$(grep -m1 -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-f]+' certs.txt || true)
        echo "expected: $EXPECTED_SIGNER_SHA256"
        echo "actual:   ${ACTUAL:-<no signer fingerprint found>}"
        if [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA256" ]; then
          echo "::error::APK signed with unexpected certificate. Publishing this would force every user to reinstall."
          exit 1
        fi
        rm -f certs.txt

    - name: Remove keystore from runner
      if: always()
      run: rm -f "$RUNNER_TEMP/release.jks"

    # The tag must match the versionName in app/build.gradle.kts, otherwise the release
    # would ship an APK that reports a different version than the release claims.
    - name: Check tag matches app version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "tag=$TAG_VERSION app=$APP_VERSION"
        if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match versionName $APP_VERSION in app/build.gradle.kts"
          exit 1
        fi

    # Pull this version's section out of CHANGELOG.md to use as the release body.
    - name: Extract release notes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        awk -v v="$VERSION" '
          $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > RELEASE_NOTES.md
        if [ ! -s RELEASE_NOTES.md ]; then
          echo "::error::No CHANGELOG.md section found for version $VERSION"
          exit 1
        fi
        echo "--- release notes ---"
        cat RELEASE_NOTES.md

    # Give the APK a versioned name so downloads from different releases are distinct.
    - name: Name the APK
      if: startsWith(github.ref, 'refs/tags/')
      run: cp app/build/outputs/apk/release/app-release.apk "AIUsageWidget-${GITHUB_REF_NAME}.apk"

    - name: Release APK
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: AI Usage Widget ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        files: AIUsageWidget-${{ github.ref_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
